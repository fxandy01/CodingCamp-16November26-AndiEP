<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="dashboard">
    <!-- Greeting -->
    <header class="card greeting">
      <p id="date" class="date"></p>
      <h1 id="time" class="time">00:00:00</h1>
      <p id="greeting" class="greeting-text"></p>
    </header>

    <!-- Focus Timer -->
    <section class="card timer" aria-labelledby="timer-title">
      <h2 id="timer-title">Focus Timer</h2>
      <div id="timer-display" class="timer-display">25:00</div>
      <form id="timer-form" class="timer-settings">
        <label for="timer-minutes">Minutes</label>
        <input id="timer-minutes" type="number" min="1" max="180" value="25" required>
        <button type="submit" class="btn small">Set</button>
      </form>
      <div class="button-row">
        <button id="timer-start" class="btn primary">Start</button>
        <button id="timer-stop" class="btn">Stop</button>
        <button id="timer-reset" class="btn">Reset</button>
      </div>
    </section>

    <!-- To-Do List -->
    <section class="card todo" aria-labelledby="todo-title">
      <h2 id="todo-title">To-Do List</h2>
      <form id="todo-form" class="inline-form">
        <input id="todo-input" type="text" placeholder="Add a new task..." maxlength="120" required>
        <button type="submit" class="btn primary">Add</button>
      </form>
      <p id="todo-message" class="message" role="alert"></p>
      <div class="sort-row">
        <label for="todo-sort">Sort by</label>
        <select id="todo-sort">
          <option value="added">Order added</option>
          <option value="az">A to Z</option>
          <option value="za">Z to A</option>
          <option value="active">Not done first</option>
          <option value="done">Done first</option>
        </select>
      </div>
      <ul id="todo-list" class="todo-list"></ul>
      <p id="todo-empty" class="empty">No tasks yet. Add one above.</p>
    </section>

    <!-- Quick Links -->
    <section class="card links" aria-labelledby="links-title">
      <h2 id="links-title">Quick Links</h2>
      <form id="link-form" class="inline-form">
        <input id="link-name" type="text" placeholder="Name" maxlength="30" required>
        <input id="link-url" type="text" placeholder="example.com" required>
        <button type="submit" class="btn primary">Add</button>
      </form>
      <div id="link-list" class="link-list"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
